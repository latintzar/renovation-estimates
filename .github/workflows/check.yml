name: Checks
on: [push, pull_request]
permissions:
  contents: read
env:
  NEXT_TELEMETRY_DISABLED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  calculation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-first-result.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/first-estimate.py
      - run: python tools/build-native-sample.py --output /tmp/native-workspace.json
      - run: cmp frontend/src/fixtures/native-workspace.json /tmp/native-workspace.json
      - run: python tools/export-first-result.py --check
      - run: python -m pip check
      - run: python tools/link-gate.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: node --test tests/native-api.test.mjs
      - run: python3 tools/sample-app.py build --base-path /apps/estimates
      - run: npm audit
        working-directory: frontend
      - run: python tools/source-reference.py --check
      - run: python3 -m pip install playwright==1.62.0
      - run: python3 -m playwright install --with-deps chromium
      - name: Native listing, cached report and budget
        run: |
          python3 tools/sample-app.py start --base-path /apps/estimates --port 4190 > /tmp/estimates-native-ci.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(100):
              try:
                  urllib.request.urlopen('http://127.0.0.1:4190/apps/estimates/listings',timeout=1).close()
                  break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit('Native workspace did not start')
          PY
          NATIVE_TEST_ORIGIN=http://127.0.0.1:4190 python3 tests/browser_native.py
